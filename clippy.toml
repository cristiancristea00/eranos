# Three kinds of exception apply beyond one item: what a test needs to fail
# loudly, the size of the binding core's error, and duplicate crates that
# only a dependency's release can remove. Every other exception is an
# `#[expect(..., reason = "...")]` in the code.

# Tests are held to the same lints as the library, except that a panic is how
# a test reports failure: unwrapping, expecting, panicking, and indexing are
# allowed inside test functions and `#[cfg(test)]` modules.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# `result_large_err` reports a function whose error is this many bytes or
# more. The binding core's `EranosError` is the enum that UniFFI and
# Diplomat copy field for field, and UniFFI 0.29, which the KMP glue
# builds on, lowers no `Box`, so no case can box what it holds. An amount
# carries its currency's details, two texts among them, and the failures
# that hold two amounts make the error 160 bytes on a 64-bit target, which
# every function of the core and the UniFFI glue returns. The threshold is
# one byte above it, so an error that grows reports again.
large-error-threshold = 161

# `multiple_crate_versions` reads `cargo metadata`, which also lists crates
# that are never built, and it fires in every target, so it cannot be an
# `#[expect]`. Each entry names the dependency and the upstream fix; an entry
# goes when no dependency needs it.
# - bitflags: jiff-core's weak `defmt?/alloc` feature lists defmt, and with
#   it bitflags 1, which is never built (BurntSushi/jiff#643), beside the
#   bitflags 2 of rlibphonenumber's dependencies.
# - syn: jiff lists jiff-static (syn 2) under a `cfg(any())` that never holds,
#   and defmt-macros (syn 2) through the same weak feature
#   (rust-lang/cargo#10801), which BurntSushi/jiff#650 and #643 remove; and
#   rlibphonenumber's build compiles syn 2 for its own macros, prost-derive,
#   and the logos code generators.
# - thiserror and thiserror-impl: rlibphonenumber 2.2 depends on thiserror 1,
#   built beside eranos's thiserror 2.
# - winnow: toml 0.9.12, with which uniffi_macros 0.31.2 builds eranos-web,
#   depends on winnow 0.7 and, through toml_parser 1.1, on winnow 1. The
#   toml 1 of uniffi 0.32 depends on winnow 1 alone, so the entry goes when
#   uniffi-bindgen-react-native generates for uniffi 0.32.
allowed-duplicate-crates = ["bitflags", "syn", "thiserror", "thiserror-impl", "winnow"]
