# Two kinds of exception apply beyond one item: what a test needs to fail
# loudly, and duplicate crates that only a dependency's release can remove.
# Every other exception is an `#[expect(..., reason = "...")]` in the code.

# Tests are held to the same lints as the library, except that a panic is how
# a test reports failure: unwrapping, expecting, panicking, and indexing are
# allowed inside test functions and `#[cfg(test)]` modules.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# `multiple_crate_versions` reads `cargo metadata`, which also lists crates
# that are never built, and it fires in every target, so it cannot be an
# `#[expect]`. Each entry names the dependency and the upstream fix; an entry
# goes when no dependency needs it.
# - bitflags: jiff-core's weak `defmt?/alloc` feature lists defmt, and with
#   it bitflags 1, which is never built (BurntSushi/jiff#643), beside the
#   bitflags 2 of rlibphonenumber's dependencies.
# - syn: jiff lists jiff-static (syn 2) under a `cfg(any())` that never holds,
#   and defmt-macros (syn 2) through the same weak feature
#   (rust-lang/cargo#10801), which BurntSushi/jiff#650 and #643 remove; and
#   rlibphonenumber's build compiles syn 2 for its own macros, prost-derive,
#   and the logos code generators.
# - thiserror and thiserror-impl: rlibphonenumber 2.2 depends on thiserror 1,
#   built beside eranos's thiserror 2.
allowed-duplicate-crates = ["bitflags", "syn", "thiserror", "thiserror-impl"]
