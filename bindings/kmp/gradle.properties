# The UniFFI plugin's Android runtime depends on AndroidX, which the Android
# plugin accepts only with it turned on.
android.useAndroidX=true
# The Gradle daemon runs the Android and Kotlin plugins in one JVM; with
# Gradle's default 512 MiB heap and 384 MiB of metaspace it runs out of
# metaspace and restarts after every build.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
# The tests of an x64 Apple target cannot run on an arm64 Mac, nor those of
# any Apple target elsewhere; the gates run the layer's tests on the JVM.
kotlin.native.ignoreDisabledTargets=true
# The generated code that the Apple targets share calls the C declarations of
# each target's cinterop, which a shared source set sees only commonised.
kotlin.mpp.enableCInteropCommonization=true
