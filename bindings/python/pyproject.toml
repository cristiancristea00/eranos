# The eranos library for Python: a hand-written layer in `src/eranos` over the
# module that UniFFI generates from eranos-uniffi, which `cargo xtask` copies
# into `src/eranos/_internal` beside a link to the library it loads. The
# gates run the package's tests, ports, and checks from the source tree,
# without building or installing the package.

[project]
name = "eranos"
version = "0.8.0"
description = "Split and settle shared expenses: the eranos library for Python"
requires-python = ">=3.14"
dependencies = []

[project.urls]
Repository = "https://github.com/cristiancristea00/eranos"

[dependency-groups]
dev = [
    "coverage",
    "maturin",
    "pytest",
    "ruff",
    "sphinx",
    "ty",
]

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
# The wheel of `cargo xtask package python`: the layer beside the module that
# UniFFI's generator writes from eranos-uniffi's release library, which
# maturin runs through the workspace's `uniffi-bindgen`, and the library
# itself, in `eranos._internal`. maturin writes that directory whole, its
# `__init__.py` included, so none of what the source tree holds there goes
# in: the gates' module and the link to the debug library among it.
bindings = "uniffi"
manifest-path = "../../crates/eranos-uniffi/Cargo.toml"
module-name = "eranos._internal"
python-source = "src"
exclude = ["src/eranos/_internal/*", "**/__pycache__/**"]

[tool.uv]
package = false
# A system Python 3.14, such as Homebrew's, before one uv installed itself,
# which may be a free-threaded build.
python-preference = "system"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
# The generated module is read for its types, but not checked: its code keeps to no checker.
exclude = ["src/eranos/_internal/eranos.py"]

[tool.ty.rules]
all = "error"

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src/eranos"]
omit = ["src/eranos/_internal/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
# An exhaustive match ends in assert_never, which no value reaches.
exclude_also = ["assert_never\\("]
