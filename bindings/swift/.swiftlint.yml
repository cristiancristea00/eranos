# SwiftLint for the hand-written Swift of the package: its manifest, the
# Eranos module, and the tests. The generated module is never linted.
included:
  - Package.swift
  - Sources/Eranos
  - Tests

excluded:
  - Sources/EranosGenerated
  - .build

reporter: "xcode"

allow_zero_lintable_files: false

check_for_updates: false

only_rules:
# Default Rules
  - attribute_name_spacing
  - blanket_disable_command
  - block_based_kvo
  - class_delegate_protocol
  - closing_brace
  - colon
  - comma
  - comment_spacing
  - computed_accessors_order
  - control_statement
  - discouraged_direct_init
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicate_imports
  - duplicated_key_in_dictionary_literal
  - dynamic_inline
  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - file_length
  - for_where
  - force_cast
  - force_try
  - function_body_length
  - function_name_whitespace
  - generic_type_name
  - implicit_getter
  - implicit_optional_initialization
  - invalid_swiftlint_command
  - is_disjoint
  - large_tuple
  - leading_whitespace
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_hashing
  - legacy_nsgeometry_functions
  - legacy_random
  - line_length
  - mark
  - multiple_closures_with_trailing_closure
  - nesting
  - no_fallthrough_only
  - no_space_in_method_call
  - ns_number_init_as_function_reference
  - nsobject_prefer_isequal
  - opening_brace
  - orphaned_doc_comment
  - prefer_type_checking
  - private_over_fileprivate
  - private_unit_test
  - protocol_property_accessors_order
  - reduce_boolean
  - redundant_discardable_let
  - redundant_objc_attribute
  - redundant_sendable
  - redundant_set_access_control
  - redundant_string_enum_value
  - redundant_void_return
  - return_arrow_whitespace
  - self_in_property_initialization
  - shorthand_operator
  - statement_position
  - static_over_final_class
  - superfluous_disable_command
  - switch_case_alignment
  - syntactic_sugar
  - todo
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - type_body_length
  - type_name
  - unavailable_condition
  - unneeded_break_in_switch
  - unneeded_override
  - unneeded_synthesized_initializer
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_setter_value
  - valid_ibinspectable
  - vertical_parameter_alignment
  - vertical_whitespace
  - void_function_in_ternary
  - void_return
  - xctfail_message
# Opt-in Rules
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - anonymous_argument_in_multiline_closure
  - array_init
  - async_without_await
  - attributes
  - balanced_xctest_lifecycle
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - direct_return
  - discarded_notification_center_observer
  - discouraged_assert
  - discouraged_none_name
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - final_test_case
  - first_where
  - flatmap_over_map_reduce
  - ibinspectable_in_extension
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - let_var_whitespace
  - literal_expression_end_indentation
  - local_doc_comment
  - modifier_order
  - multiline_function_chains
  - multiline_literal_brackets
  - nimble_operator
  - non_overridable_class_declaration
  - nslocalizedstring_key
  - operator_usage_whitespace
  - pattern_matching_keywords
  - period_spacing
  - prefer_asset_symbols
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_subject
  - private_swiftui_state
  - reduce_into
  - redundant_nil_coalescing
  - return_value_from_void_function
  - sorted_first_last
  - sorted_imports
  - static_operator
  - superfluous_else
  - toggle_bool
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - weak_delegate

analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_import

# Default Rules
blanket_disable_command: error
block_based_kvo: error
class_delegate_protocol: error
closing_brace: error
colon: error
comma: error
comment_spacing: error
computed_accessors_order: error
control_statement: error
discouraged_direct_init: error
duplicate_imports: error
duplicated_key_in_dictionary_literal: error
empty_enum_arguments: error
empty_parameters: error
empty_parentheses_with_trailing_closure: error
file_length:
  warning: 1000
  error: 1500
  ignore_comment_only_lines: true
for_where: error
function_body_length:
  warning: 100
  error: 200
function_name_whitespace: error
generic_type_name:
  min_length:
    warning: 1
    error: 0
  max_length:
    warning: 50
    error: 100
implicit_getter: error
implicit_optional_initialization: error
invalid_swiftlint_command: error
is_disjoint: error
large_tuple:
  warning: 5
  error: 6
leading_whitespace: error
legacy_cggeometry_functions: error
legacy_constant: error
legacy_constructor: error
legacy_hashing: error
legacy_nsgeometry_functions: error
legacy_random: error
line_length:
  warning: 200
  error: 250
  ignores_urls: true
  ignores_comments: true
mark: error
multiple_closures_with_trailing_closure: error
no_fallthrough_only: error
no_space_in_method_call: error
ns_number_init_as_function_reference: error
nsobject_prefer_isequal: error
opening_brace: error
orphaned_doc_comment: error
prefer_type_checking: error
private_over_fileprivate:
  validate_extensions: true
private_unit_test: error
protocol_property_accessors_order: error
reduce_boolean: error
redundant_discardable_let: error
redundant_objc_attribute: error
redundant_sendable: error
redundant_set_access_control: error
redundant_string_enum_value: error
redundant_void_return: error
return_arrow_whitespace: error
self_in_property_initialization: error
statement_position: error
static_over_final_class: error
superfluous_disable_command: error
switch_case_alignment: error
syntactic_sugar: error
trailing_comma: error
trailing_newline: error
trailing_semicolon: error
trailing_whitespace:
  severity: error
  ignores_comments: false
type_body_length:
  warning: 1000
  error: 2000
type_name:
  min_length:
    warning: 3
    error: 0
  max_length:
    warning: 50
    error: 100
unavailable_condition: error
unneeded_break_in_switch: error
unneeded_override: error
unneeded_synthesized_initializer: error
unused_closure_parameter: error
unused_control_flow_label: error
unused_enumerated: error
unused_setter_value: error
valid_ibinspectable: error
vertical_parameter_alignment: error
vertical_whitespace:
  severity: error
  max_empty_lines: 2
void_function_in_ternary: error
void_return: error
xctfail_message: error
# Opt-in Rules
anonymous_argument_in_multiline_closure: error
array_init: error
async_without_await: error
attributes:
  severity: error
  always_on_same_line: ["@IBAction", "@NSManaged", "@Environment", "@NSApplicationDelegateAdaptor"]
balanced_xctest_lifecycle: error
closure_end_indentation: error
closure_spacing: error
collection_alignment: error
comma_inheritance: error
contains_over_filter_count: error
contains_over_filter_is_empty: error
contains_over_first_not_nil: error
contains_over_range_nil_comparison: error
convenience_type: error
direct_return: error
discarded_notification_center_observer: error
discouraged_assert: error
discouraged_none_name: error
discouraged_object_literal: error
empty_collection_literal: error
empty_count: error
empty_string: error
empty_xctest_method: error
enum_case_associated_values_count:
  warning: 4
  error: 5
explicit_init: error
extension_access_modifier: error
fatal_error_message: error
final_test_case: error
first_where: error
flatmap_over_map_reduce: error
ibinspectable_in_extension: error
identical_operands: error
joined_default_parameter: error
last_where: error
legacy_multiple: error
let_var_whitespace: error
literal_expression_end_indentation: error
local_doc_comment: error
modifier_order: error
multiline_function_chains: error
multiline_literal_brackets: error
nimble_operator: error
non_overridable_class_declaration: error
operator_usage_whitespace: error
pattern_matching_keywords: error
period_spacing: error
prefer_self_type_over_type_of_self: error
prefer_zero_over_explicit_init: error
private_action: error
private_subject: error
private_swiftui_state: error
reduce_into: error
redundant_nil_coalescing: error
return_value_from_void_function: error
sorted_first_last: error
sorted_imports: error
static_operator: error
superfluous_else: error
toggle_bool: error
unavailable_function: error
unneeded_parentheses_in_closure_argument: error
untyped_error_in_catch: error
vertical_parameter_alignment_on_call: error
vertical_whitespace_closing_braces: error
vertical_whitespace_opening_braces: error
weak_delegate: error
# Analyzer Rules
capture_variable: error
typesafe_array_init: error
unused_import:
  severity: error
  require_explicit_imports: true
