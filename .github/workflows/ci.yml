# The gates of AGENTS.md, plus an MSRV build, compile checks for the mobile
# targets, a dependency audit, a lint of the workflow files, and a coverage
# page; on a manual dispatch, every gate with the bindings' toolchains, on
# Linux and on macOS, and the coverage of the binding glue. Coverage is
# reported, never enforced.
name: CI

on:
  push:
    # Every branch. Tags are left out: a tag names a commit that its branch
    # push has already tested. Quoted, because a bare `*` starts a YAML alias.
    branches: ["**"]
  pull_request:
  # Sent only to repositories with a merge queue, which needs an
  # organisation; a repository owned by a personal account never receives it.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      bindings:
        description: Also run every gate with the bindings' toolchains, on Linux and on macOS
        type: boolean
        default: false

permissions:
  # Cloning a private repository needs read access; no job writes.
  contents: read

concurrency:
  # One group per event and ref (or pull request), so a push never cancels a
  # dispatched run. Off main, a newer run cancels the older one; on main, a
  # started run finishes and a newer push replaces only a pending one.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    # A named `bash` runs as `bash --noprofile --norc -eo pipefail {0}`; on
    # Windows it is Git Bash.
    shell: bash

jobs:
  lint:
    name: Lint
    # A pull request whose branch lives in this repository was tested by the
    # push of its head commit; pull requests from forks run. The other jobs
    # repeat this condition through the alias, so this job stays first: an
    # alias must follow its anchor.
    if: &not-duplicate github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The toolchain and components rust-toolchain.toml names, including
      # llvm-tools, which the runner image's stable lacks.
      - run: rustup toolchain install
      # After the toolchain, because the cache key includes the rustc
      # version. Only main writes caches; other branches restore main's. The
      # action also sets CARGO_INCREMENTAL=0.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
      # No package may turn on a feature of async-lock: with `std`, the lock
      # would gain blocking methods that read the clock and a per-thread
      # parker (AGENTS.md, the gates).
      - name: Keep async-lock without features
        run: |
          tree=$(cargo tree --workspace --all-features --edges normal,features --invert async-lock --prefix none --locked)
          if grep '^async-lock feature ' <<< "$tree"; then
            echo "::error::a package turns on a feature of async-lock, which the library keeps off"
            exit 1
          fi

  test:
    name: Test
    if: *not-duplicate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the library
        run: cargo build --workspace --all-features --locked
      # Builds the test targets and the examples, then runs the unit,
      # integration, and doc tests (the README's included).
      - run: cargo test --workspace --all-features --locked
      - name: Run every example
        # The examples assert their key numbers, so one that fails fails the
        # job. The list comes from the manifest, and stdin is closed so that
        # an example cannot read the rest of the list.
        run: |
          examples="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | .name as $package | .targets[] | select(.kind == ["example"]) | "\($package) \(.name)"')"
          test -n "$examples"
          while read -r package example; do
            echo "::group::$package: $example"
            cargo run --locked --quiet --package "$package" --all-features --example "$example" </dev/null
            echo "::endgroup::"
          done <<<"$examples"
      - name: Run each benchmark once
        # Started by `cargo test`, criterion runs every benchmark function once
        # without measuring it, in the test profile rather than the release
        # profile's fat LTO. `--benches` would rerun the library's unit tests
        # too, because the library target has `bench = true`.
        run: cargo test --workspace --all-features --locked --bench '*'
      - run: cargo test --workspace --no-default-features --locked

  test-other-os:
    # No matrix context in the name: GitHub appends the matrix values to a
    # job it runs, but shows a skipped job's name unexpanded.
    name: Test on other OS
    # Dispatched by hand only: macOS minutes count about ten times and Windows
    # minutes about twice against the 2,000 included each month.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --all-features --locked
      - run: cargo test --workspace --no-default-features --locked

  msrv:
    name: MSRV
    if: *not-duplicate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Equal to `rust-version` in Cargo.toml. Cargo refuses a toolchain older
      # than that, so raising it there fails this job until both match. Set
      # for the whole job, it overrides rust-toolchain.toml for every cargo
      # and rustc call, the cache key's included. Quoted, so that a version
      # such as 1.90 stays text.
      RUSTUP_TOOLCHAIN: "1.97"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --all-features --locked
      - run: cargo check --workspace --lib --no-default-features --locked

  mobile:
    name: Mobile and wasm targets
    if: *not-duplicate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # The targets' standard libraries, added to the toolchain that
      # rust-toolchain.toml selects. Clippy only type-checks, so no linker,
      # Android NDK, or Xcode SDK is needed; no dependency of the library
      # compiles C code for the target. wasm32-wasip1 compiles the library's
      # `target_family = "wasm"` code as the browser does, for every crate
      # but eranos-capi, whose worker thread drives each asynchronous C call
      # with `block_on`, which is not compiled for wasm. The browser's
      # wasm32-unknown-unknown has no clock or random source without uuid's
      # `js` feature, which eranos-web, the crate that packages the library
      # for the browser, turns on (BINDINGS.md § 2), so that target lints
      # eranos-web alone. `cargo xtask gates` runs the same steps without
      # `--locked`, and its tests keep the two alike.
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android x86_64-linux-android wasm32-wasip1 wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: >-
          cargo clippy --workspace --lib --all-features --locked
          --target aarch64-apple-ios --target aarch64-apple-ios-sim
          --target aarch64-linux-android --target x86_64-linux-android
          -- -D warnings
      - run: >-
          cargo clippy --workspace --lib --no-default-features --locked
          --target aarch64-apple-ios --target aarch64-apple-ios-sim
          --target aarch64-linux-android --target x86_64-linux-android
          -- -D warnings
      - run: >-
          cargo clippy --workspace --exclude eranos-capi --lib --all-features --locked
          --target wasm32-wasip1
          -- -D warnings
      - run: >-
          cargo clippy --workspace --exclude eranos-capi --lib --no-default-features --locked
          --target wasm32-wasip1
          -- -D warnings
      - run: >-
          cargo clippy --package eranos-web --lib --all-features --locked
          --target wasm32-unknown-unknown
          -- -D warnings
      - run: >-
          cargo clippy --package eranos-web --lib --no-default-features --locked
          --target wasm32-unknown-unknown
          -- -D warnings

  deny:
    name: Dependency audit
    if: *not-duplicate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # cargo-deny reads the dependency graph through `cargo metadata`.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2.87.19
        with:
          tool: cargo-deny@0.20.2
      # Advisories (vulnerable, unmaintained, unsound, yanked) and sources
      # only; deny.toml holds the rules.
      - run: cargo deny --locked check advisories sources

  workflows:
    name: Workflow lint
    if: *not-duplicate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The image bundles shellcheck, which checks every `run:` script.
      - run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      # Reads .github/zizmor.yml.
      - uses: zizmorcore/zizmor-action@v0.6.4
        with:
          # SARIF upload needs code scanning, which a private repository on
          # the Free plan lacks; findings print to the log and fail the step.
          advanced-security: false

  coverage:
    name: Coverage
    if: *not-duplicate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.87.19
        with:
          tool: cargo-llvm-cov@0.9.1
      # Unit and integration tests; the stable toolchain does not measure
      # doctests. Each feature set compiles an identifier generator the
      # other leaves out, so the report merges both runs. The UniFFI glue and
      # its generators have no Rust tests: the foreign tests measure the glue,
      # eranos-web compiles the sources of eranos-uniffi for WebAssembly,
      # which stable Rust cannot measure, eranos-kmp compiles them again for
      # gobley, and the C and C++ tests measure eranos-capi. The glue's proc
      # macros run inside the compiler, only when a crate that invokes them
      # compiles; eranos-glue's tests measure what they call.
      - run: >-
          cargo llvm-cov --no-report --workspace --all-features --locked
          --exclude eranos-uniffi --exclude eranos-uniffi-bindgen
          --exclude eranos-web --exclude eranos-kmp --exclude eranos-capi
          --exclude eranos-glue-macros
      - run: >-
          cargo llvm-cov --no-report --workspace --no-default-features --locked
          --exclude eranos-uniffi --exclude eranos-uniffi-bindgen
          --exclude eranos-web --exclude eranos-kmp --exclude eranos-capi
          --exclude eranos-glue-macros
      # The runs build the proc macros instrumented all the same, as a
      # dependency of the crates they test, and a report that kept their files
      # would read them as run or unrun as the cache decides.
      - name: Export the reports
        run: |
          cargo llvm-cov report --ignore-filename-regex eranos-glue-macros/ --cobertura --output-path target/coverage.xml
          cargo llvm-cov report --ignore-filename-regex eranos-glue-macros/ --json --summary-only --output-path target/coverage.json
      - name: Render one HTML page
        # gcovr reads only Cobertura, and takes only line counts from it; the
        # sources come from the checkout. One file with its styles and scripts
        # inlined is what an unzipped artefact can hold.
        run: >-
          pipx run --spec gcovr==8.6 gcovr
          --cobertura-add-tracefile target/coverage.xml
          --html-details target/eranos-coverage.html
          --html-single-page --html-self-contained
          --html-theme github.green
          --html-title "eranos coverage"
      - name: Upload the page
        id: upload
        uses: actions/upload-artifact@v7.0.1
        with:
          # Not zipped, so the page opens in the browser, and the file name is
          # the artefact's name. It is stored uncompressed against the 500 MB
          # of artefact storage, hence the short retention.
          path: target/eranos-coverage.html
          archive: false
          retention-days: 7
          if-no-files-found: error
      - name: Summarise
        env:
          # Through the environment, not a template inside the script.
          ARTEFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo '## Coverage'
            echo
            echo "Annotated source with line counts: [eranos-coverage.html]($ARTEFACT_URL)"
            echo
            echo '| File | Regions | Functions | Lines |'
            echo '| :--- | ---: | ---: | ---: |'
            jq -r --arg root "$GITHUB_WORKSPACE/" '
              def cell: if .count == 0 then "-" else "\(.covered)/\(.count) (\(.percent * 100 | floor / 100)%)" end;
              .data[0]
              | (.files[] | "| `\(.filename | ltrimstr($root))` | \(.summary.regions | cell) | \(.summary.functions | cell) | \(.summary.lines | cell) |"),
                "| **Total** | \(.totals.regions | cell) | \(.totals.functions | cell) | \(.totals.lines | cell) |"
            ' target/coverage.json
          } >>"$GITHUB_STEP_SUMMARY"

  bindings-linux:
    name: Bindings on Linux
    # Every gate of AGENTS.md, with the toolchains of the Kotlin, Java, web,
    # Kotlin Multiplatform, C, C++, and Python packages, which a push does
    # not install; the Swift package and the Apple targets need macOS. Only
    # on a dispatch that asks for the bindings, like the job after it.
    if: github.event_name == 'workflow_dispatch' && inputs.bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env: &bindings-env
      # Without debug information, which no gate reads: with it, the builds
      # for every target pass 40 GB, more than a runner's disk leaves free.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      # The image leaves about 20 of its 72 GB free, and the gates' builds
      # need more: without this, the disk fills during the gates, and the
      # runner stops without keeping the job's log. No gate runs any of what
      # goes: Haskell, .NET, Swift, PowerShell, CodeQL, and the image's
      # Android NDKs, since both Android builds pin r30, which the SDK step
      # installs.
      - name: Free the runner's disk
        run: |
          df --human-readable /
          sudo rm -rf /usr/local/.ghcup /usr/share/dotnet /usr/share/swift /usr/local/share/powershell \
            "${AGENT_TOOLSDIRECTORY:?}/CodeQL" "${ANDROID_HOME:?}/ndk"
          df --human-readable /
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Kotlin Multiplatform package's Gradle 9.0 runs on JDK 21, which the
      # gates find through JAVA_HOME_21; JDK 25, installed last, becomes
      # JAVA_HOME, which the Kotlin and Java packages build and test with.
      - id: jdk-21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
          set-default: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      # uv installs the Python package's tools as uv.lock pins them, on the
      # Python 3.14 of .python-version, which it downloads where the image
      # has none; the release is the one Homebrew installs, which wrote
      # uv.lock.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.17
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      # The packages of docs/DEVELOPMENT.md § 1, into the image's SDK.
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.1.0 ndk;30.0.16248370
          log-accepted-android-sdk-licenses: false
      # An image may name another NDK, which cargo-ndk would take.
      - name: Name the NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >>"$GITHUB_ENV"
      # LLVM 23, whose clang-format and clang-tidy check the C and C++
      # layers, as Homebrew installs it: another release formats and lints
      # otherwise. Its tools sit unsuffixed in /usr/lib/llvm-23/bin.
      - name: Install LLVM
        run: |
          curl --fail --silent --show-error --location https://apt.llvm.org/llvm.sh --output "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 23 all
          echo "LLVM_HOME=/usr/lib/llvm-23" >>"$GITHUB_ENV"
      # The releases Homebrew installs: an older Doxygen reports other
      # warnings, and another ktlint formats otherwise.
      - name: Install Doxygen and ktlint
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz |
            tar --extract --gzip --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >>"$GITHUB_PATH"
          mkdir "$RUNNER_TEMP/ktlint"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/ktlint/ktlint" \
            https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x "$RUNNER_TEMP/ktlint/ktlint"
          echo "$RUNNER_TEMP/ktlint" >>"$GITHUB_PATH"
      # From the release tags that Brewfile.develop names, each for the
      # release of the crate it serves.
      - name: Install cargo-ndk, diplomat-tool, and uniffi-bindgen-react-native
        run: |
          cargo install --locked --git https://github.com/bbqsrc/cargo-ndk --tag v4.1.2 cargo-ndk
          cargo install --locked --git https://github.com/rust-diplomat/diplomat --tag v0.16.1 diplomat-tool
          cargo install --locked --git https://github.com/jhugman/uniffi-bindgen-react-native --tag 0.31.0-5 uniffi-bindgen-react-native
      - run: cargo xtask gates
        env:
          JAVA_HOME_21: ${{ steps.jdk-21.outputs.path }}
      # The gates build the C and C++ packages with clang, over libstdc++
      # here and libc++ on macOS; GCC 14, which the image carries, compiles
      # their tests too, so the headers keep to the C23 and the C++23 that
      # GCC reads, over the Diplomat headers the gates generated.
      - name: Compile the C tests with GCC
        working-directory: bindings/c
        run: gcc-14 -std=c23 -Wall -Wextra -Wpedantic -Werror -fsyntax-only -Iinclude -isystem generated tests/tests.c
      - name: Compile the C++ tests with GCC
        working-directory: bindings/cpp
        run: g++-14 -std=c++23 -fno-exceptions -Wall -Wextra -Wpedantic -Werror -fsyntax-only -Iinclude -isystem generated tests/tests.cpp
      # The room the gates leave, which a change that builds more must fit in.
      - name: Show the disk the gates left
        if: always()
        run: df --human-readable /

  bindings-macos:
    name: Bindings on macOS
    # Every gate, the Swift package and the Kotlin Multiplatform package's
    # Apple targets included, then the coverage of the Rust tests and of the
    # binding glue, which only the Swift tests reach whole. Only on a
    # dispatch that asks for the bindings: macOS minutes count about ten
    # times.
    if: github.event_name == 'workflow_dispatch' && inputs.bindings
    runs-on: macos-26
    timeout-minutes: 180
    env: *bindings-env
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: jdk-21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
          set-default: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: 0.12.17
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.1.0 ndk;30.0.16248370
          log-accepted-android-sdk-licenses: false
      - name: Name the NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >>"$GITHUB_ENV"
      # The tools a developer's Brewfile.develop installs, but for the Android
      # command-line tools, the JDKs, Node, and uv, which the steps above set
      # up.
      - name: Install LLVM, Doxygen, ktlint, and SwiftLint
        run: |
          brew install llvm doxygen ktlint swiftlint
          echo "LLVM_HOME=$(brew --prefix llvm)" >>"$GITHUB_ENV"
      - name: Install cargo-ndk, diplomat-tool, and uniffi-bindgen-react-native
        run: |
          cargo install --locked --git https://github.com/bbqsrc/cargo-ndk --tag v4.1.2 cargo-ndk
          cargo install --locked --git https://github.com/rust-diplomat/diplomat --tag v0.16.1 diplomat-tool
          cargo install --locked --git https://github.com/jhugman/uniffi-bindgen-react-native --tag 0.31.0-5 uniffi-bindgen-react-native
      - uses: taiki-e/install-action@v2.87.19
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo xtask gates
        env:
          JAVA_HOME_21: ${{ steps.jdk-21.outputs.path }}
      - run: cargo xtask coverage
      - name: Export the report
        run: cargo llvm-cov report --ignore-filename-regex eranos-glue-macros/ --html --output-dir target/coverage-bindings
      - name: Upload the report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: eranos-coverage-bindings
          path: target/coverage-bindings/html
          retention-days: 7
          if-no-files-found: error
      - name: Summarise
        run: |
          {
            echo '## Coverage with the binding glue'
            echo
            echo '```text'
            cargo llvm-cov report --ignore-filename-regex eranos-glue-macros/ --summary-only
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
