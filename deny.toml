# Rules for the CI dependency audit, `cargo deny --locked check advisories
# sources`. Licences and bans are not checked, so they have no section.

[graph]
# The dependencies of every feature, `serde`'s included.
all-features = true

[advisories]
# Vulnerabilities and unmaintained crates are errors by default; a yanked
# version in Cargo.lock is one too.
yanked = "deny"
# Each entry names the crate that brings the advisory and why it stays.
ignore = [
    # paste is unmaintained. Only uniffi-bindgen-java 0.5.1, the Java
    # generator of eranos-uniffi-bindgen, uses it, as a macro at build time;
    # no library links it.
    { id = "RUSTSEC-2024-0436", reason = "a build-time macro of the Java generator only" },
]

[sources]
# crates.io only: any other registry, or a git dependency, is an error.
unknown-registry = "deny"
unknown-git = "deny"
