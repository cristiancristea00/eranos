# eranos-web: the bindings of eranos for the web, through UniFFI and
# uniffi-bindgen-react-native's wasm2 flavour. It compiles the sources of
# eranos-uniffi against UniFFI 0.31.2, the release that
# uniffi-bindgen-react-native 0.31.0-6 generates TypeScript for
# (docs/BINDINGS.md § 8).
[package]
name = "eranos-web"
description = "The bindings of eranos for the web, through UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# The WebAssembly module the generated TypeScript loads, and a Rust library
# for the host builds and lints of the workspace.
crate-type = ["cdylib", "rlib"]

[features]
# Identifiers count up from one, so the ports print the Rust examples'
# reports.
sequential-ids = ["eranos-bindings/sequential-ids"]

[dependencies]
eranos-bindings = { workspace = true }
eranos-glue-macros = { workspace = true }
# Pinned here rather than in the workspace, which pins 0.32.2 for
# eranos-uniffi: UniFFI's macros name the crate `::uniffi`, so a crate can
# depend on one release only, under that name.
uniffi = { version = "=0.31.2", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
# uniffi_core compiles for wasm32 only with its single-threaded support,
# which drops the `Send` and `Sync` bounds that a page's one thread has no
# use for.
uniffi = { version = "=0.31.2", default-features = false, features = ["wasm-unstable-single-threaded"] }
uniffi-runtime-wasm = { workspace = true }
# UUID v7 identifiers read the clock and the random source through
# JavaScript on wasm32-unknown-unknown, which has neither.
uuid = { workspace = true, features = ["js"] }
wasm-bindgen = { workspace = true }

[lints]
workspace = true
