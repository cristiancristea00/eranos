# eranos-kmp: the bindings of eranos for Kotlin Multiplatform, through UniFFI
# and gobley. It compiles the sources of eranos-uniffi against UniFFI 0.29.4,
# the release whose metadata gobley 0.3.7's generator reads
# (docs/BINDINGS.md § 8).
[package]
name = "eranos-kmp"
description = "The bindings of eranos for Kotlin Multiplatform, through UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# A shared library for Android and the JVM, whose metadata the generator
# reads, a static one that the Apple natives link, and a Rust library for the
# host builds and lints of the workspace.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Identifiers count up from one, so the ports print the Rust examples'
# reports.
sequential-ids = ["eranos-bindings/sequential-ids"]

[dependencies]
eranos-bindings = { workspace = true }
eranos-glue-macros = { workspace = true }
# Pinned here rather than in the workspace, which pins 0.32.2 for
# eranos-uniffi: UniFFI's macros name the crate `::uniffi`, so a crate can
# depend on one release only, under that name.
uniffi = { version = "=0.29.4", default-features = false }

[lints]
workspace = true
