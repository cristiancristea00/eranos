# eranos-transfer: money one member paid another, such as a repayment, and
# its conversion into the group currency. An internal crate: the `eranos`
# crate re-exports the types callers use.
[package]
name = "eranos-transfer"
description = "The transfers of eranos, re-exported by the eranos crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `Serialize` and `Deserialize` for transfers.
serde = ["dep:serde", "eranos-calendar/serde", "eranos-core/serde", "eranos-money/serde"]

[dependencies]
eranos-calendar = { workspace = true }
eranos-core = { workspace = true }
eranos-money = { workspace = true }
eranos-settlement = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
# The documentation examples use the paths callers use.
eranos = { workspace = true }
# The tests settle a ledger to obtain a payment to record.
eranos-ledger = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
