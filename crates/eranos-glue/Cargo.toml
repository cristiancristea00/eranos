# eranos-glue: the model of the binding core's group calls and records, and
# the code the glue writes from them: the core's handle forms and table, the
# mirrors' macros, the UniFFI crates' objects and remote copies, and the C
# glue's bridge. The proc macros of eranos-glue-macros call it inside the
# compiler, and `cargo xtask generate` calls it for the C bridge; its own
# tests measure it (docs/BINDINGS.md § 8).
[package]
name = "eranos-glue"
description = "The model of eranos's group calls and records, and the glue code written from it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[lints]
workspace = true
