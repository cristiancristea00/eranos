# eranos-category: the categories a group sorts its expenses into, with
# names unique under Unicode caseless matching. An internal crate: the
# `eranos` crate re-exports the types callers use.
[package]
name = "eranos-category"
description = "The expense categories of eranos, re-exported by the eranos crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `Serialize` and `Deserialize` for categories.
serde = ["dep:serde", "eranos-core/serde"]

[dependencies]
eranos-core = { workspace = true }
icu_casemap = { workspace = true }
icu_normalizer = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
# The documentation examples use the paths callers use.
eranos = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
