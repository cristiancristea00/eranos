# xtask: the repository's automation, run as `cargo xtask <command>` through
# the alias in .cargo/config.toml. It runs the commit gates AGENTS.md lists, so
# a contributor, the VS Code task, and a coding agent run one sequence.
[package]
name = "xtask"
description = "The eranos repository's automation: the commit gates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
