# eranos: the library. Pure and synchronous (no I/O, no async, and no global
# state but the phone-number metadata, decoded once on first use, and what
# identifier generation holds), so every rule is unit-testable and the
# binding crates can wrap it without adapting to a runtime.
[package]
name = "eranos"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "../../README.md"

[features]
# `Serialize` and `Deserialize` for a group and every type it stores. A
# deserialised `Group` is rebuilt through the same validation as its `add_*`
# methods.
serde = [
    "dep:serde",
    "eranos-account/serde",
    "eranos-calendar/serde",
    "eranos-category/serde",
    "eranos-contact/serde",
    "eranos-core/serde",
    "eranos-member/serde",
    "eranos-money/serde",
]
# Identifiers count up from one instead of reading the clock and the random
# source, so examples and tests print the same text on every run. Never for
# apps: identifiers from two devices would collide.
sequential-ids = ["eranos-core/sequential-ids"]

[dependencies]
eranos-account = { workspace = true }
eranos-calendar = { workspace = true }
eranos-category = { workspace = true }
eranos-contact = { workspace = true }
eranos-core = { workspace = true }
eranos-ledger = { workspace = true }
eranos-member = { workspace = true }
eranos-money = { workspace = true }
icu_locale_core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }
tabled = { workspace = true }

[[example]]
name = "persistence"
required-features = ["serde"]

[[example]]
name = "grand_tour"
required-features = ["serde"]

[[bench]]
name = "settlement"
harness = false

[[bench]]
name = "ledger"
harness = false

[lints]
workspace = true
