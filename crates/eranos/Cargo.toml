# eranos: the library. Pure and synchronous (no I/O, no async, and no global
# state but the phone-number metadata, decoded once on first use), so every
# rule is unit-testable and the binding crates can wrap it without adapting
# to a runtime.
[package]
name = "eranos"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "../../README.md"

[features]
# `Serialize` and `Deserialize` for a group and every type it stores. A
# deserialised `Group` is rebuilt through the same validation as its `add_*`
# methods.
serde = ["dep:serde", "uuid/serde"]

[dependencies]
icu_casemap = { workspace = true }
icu_locale_core = { workspace = true }
icu_normalizer = { workspace = true }
icu_properties = { workspace = true }
iso4217-static = { workspace = true }
jiff = { workspace = true }
rlibphonenumber = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }
tabled = { workspace = true }

[[example]]
name = "persistence"
required-features = ["serde"]

[[bench]]
name = "settlement"
harness = false

[[bench]]
name = "ledger"
harness = false

[lints]
workspace = true
