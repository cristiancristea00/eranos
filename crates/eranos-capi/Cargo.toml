# eranos-capi: the bindings of eranos for C and C++, through Diplomat. One
# bridge generates the C API, `eranos.h`, and the C++ headers beneath the
# hand-written C++ layer (docs/BINDINGS.md § 8).
[package]
name = "eranos-capi"
description = "The bindings of eranos for C and C++, through Diplomat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# A static and a shared library for C and C++ programs, and a Rust library
# for the host builds and lints of the workspace.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Identifiers count up from one, so the ports print the Rust examples'
# reports.
sequential-ids = ["eranos-bindings/sequential-ids"]

[dependencies]
diplomat = { workspace = true }
diplomat-runtime = { workspace = true }
eranos = { workspace = true }
eranos-bindings = { workspace = true }

[lints]
workspace = true
