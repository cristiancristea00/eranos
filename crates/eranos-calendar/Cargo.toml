# eranos-calendar: calendar dates and times of day, without time zones. An
# internal crate: the `eranos` crate re-exports the types callers use.
[package]
name = "eranos-calendar"
description = "The calendar dates and times of day of eranos, re-exported by the eranos crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `Serialize` and `Deserialize` for dates and times, as their ISO 8601 text.
serde = ["dep:serde", "eranos-core/serde"]

[dependencies]
eranos-core = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
# The documentation examples use the paths callers use.
eranos = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
