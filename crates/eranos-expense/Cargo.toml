# eranos-expense: what was bought, who paid, and how the cost is shared, and
# the resolution of an expense into group-currency shares. An internal crate:
# the `eranos` crate re-exports the types callers use.
[package]
name = "eranos-expense"
description = "The expenses of eranos, re-exported by the eranos crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `Serialize` and `Deserialize` for expenses, their items, splits, and tips.
serde = ["dep:serde", "eranos-calendar/serde", "eranos-core/serde", "eranos-money/serde"]

[dependencies]
eranos-calendar = { workspace = true }
eranos-core = { workspace = true }
eranos-ledger = { workspace = true }
eranos-money = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
# The documentation examples use the paths callers use.
eranos = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
